(function renderSubpage() {
  const id = new URLSearchParams(location.search).get('id') || 'about';
  const page = Object.hasOwn(PAGES, id) ? PAGES[id] : {
    eyebrow: 'Courtside', title: 'Page not found',
    lead: "That page isn’t here — but the courts are. Head back home.",
    blocks: []
  };

  document.title = page.title + ' — Courtside';
  document.querySelector('[data-eyebrow]').textContent = page.eyebrow;
  document.getElementById('sub-title').textContent = page.title;
  document.getElementById('sub-lead').textContent = page.lead;

  const fig = document.getElementById('sub-figure');
  const im = document.getElementById('sub-img');
  if (page.img) {
    im.onerror = () => { fig.hidden = true; }; // se a foto ainda não estiver na pasta, não quebra
    im.src = page.img;
    im.alt = page.title;
    fig.hidden = false;
  } else {
    fig.hidden = true;
  }

  const body = document.getElementById('sub-body');
  // textContent em vez de innerHTML: o conteúdo nunca é interpretado como HTML
  (page.blocks || []).forEach((b, i) => {
    const article = document.createElement('article');
    article.className = 'sub-block';
    article.style.setProperty('--i', i);
    const idx = document.createElement('span');
    idx.className = 'sub-block-index';
    idx.textContent = String(i + 1).padStart(2, '0');
    const wrap = document.createElement('div');
    const h = document.createElement('h2');
    h.className = 'sub-block-h';
    h.textContent = b.h;
    const para = document.createElement('p');
    para.className = 'sub-block-p';
    para.textContent = b.p;
    wrap.append(h, para);
    article.append(idx, wrap);
    body.appendChild(article);
  });

  // reveal suave ao rolar (dá vida à página, sem exagero)
  const reveals = document.querySelectorAll('.sub-hero > *, .sub-figure:not([hidden]), .sub-block');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    reveals.forEach(el => el.classList.add('in-view'));
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    reveals.forEach(el => io.observe(el));
  }
})();
